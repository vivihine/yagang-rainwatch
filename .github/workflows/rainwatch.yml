name: rainwatch

on:
  schedule:
    # 每小时整点运行一次（UTC）。北京时间 = UTC+8，即每小时 :00。
    # 每天 08:00 / 19:00 的日报由程序按北京时间判断并补发。
    # 注意：GitHub 免费版定时任务可能被延迟或丢弃（尤其 UTC 整点），
    # 因此额外加一个 :35 备份触发，并在 README 7.1 提供外部定时器方案。
    - cron: "0 * * * *"
    - cron: "35 * * * *"
  workflow_dispatch:
    inputs:
      force_report:
        description: "强制推送一次完整日报（云端测试用）"
        required: false
        type: boolean
        default: false
      test_email:
        description: "发送一封测试邮件给管理员（验证邮件通道）"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: rainwatch
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run rainwatch
        env:
          PYTHONPATH: src
          # 在仓库 Settings → Secrets and variables → Actions 中配置（至少配一组推送通道）：
          WXPUSHER_APP_TOKEN: ${{ secrets.WXPUSHER_APP_TOKEN }}
          WXPUSHER_UID: ${{ secrets.WXPUSHER_UID }}
          WXPUSHER_TOPIC_IDS: ${{ secrets.WXPUSHER_TOPIC_IDS }}
          WXPUSHER_SPT: ${{ secrets.WXPUSHER_SPT }}
          QWEATHER_HOST: ${{ secrets.QWEATHER_HOST }}
          QWEATHER_KEY: ${{ secrets.QWEATHER_KEY }}
          # 备选通道（可不配）：
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          BARK_KEY: ${{ secrets.BARK_KEY }}
        run: |
          set +e
          python -m rainwatch ${{ github.event_name == 'workflow_dispatch' && inputs.force_report && '--force-report' || '' }} ${{ github.event_name == 'workflow_dispatch' && inputs.test_email && '--test-email' || '' }}
          code=$?
          if [ "$code" -ne 0 ]; then
            echo "::warning::首次运行失败（退出码 $code），60 秒后自动重试一次"
            sleep 60
            python -m rainwatch ${{ github.event_name == 'workflow_dispatch' && inputs.force_report && '--force-report' || '' }} ${{ github.event_name == 'workflow_dispatch' && inputs.test_email && '--test-email' || '' }}
          fi

      - name: Weekly health report
        continue-on-error: true
        env:
          PYTHONPATH: src
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: python -m rainwatch --weekly-health

      - name: Record failure
        if: failure()
        env:
          PYTHONPATH: src
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          python -m rainwatch --record-failure || true
          git config user.name "rainwatch-bot"
          git config user.email "rainwatch-bot@users.noreply.github.com"
          if [ -n "$(git status --porcelain data)" ]; then
            git add data
            git commit -m "health: failure $(date -u +%Y-%m-%dT%H:%MZ)"
            git push || true
          fi

      - name: Commit data and dashboard
        run: |
          git config user.name "rainwatch-bot"
          git config user.email "rainwatch-bot@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add -A data docs
            git commit -m "data: $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
